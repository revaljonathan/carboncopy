gui:
  border: 'single'
  sidePanels:
    - [files, worktrees, submodules]
    - [branches, remotes, tags]
    - [commits, reflog]
    - [stash]

  theme:
    activeBorderColor:
      - 'yellow'

    inactiveBorderColor:
      - '#373d43'

    selectedLineBgColor:
      - '#373d43'

    selectedLineFgColor:
      - bold
    optionsTextColor:
      - '#8a8e9a' 
